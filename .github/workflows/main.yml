name: Rosit Quant AI Engine

on:
  schedule:
    - cron: '0 */6 * * *'  # Jalan otomatis setiap 6 jam
  workflow_dispatch:       # Tombol "Run Manual"
  push:
    branches: [ main ]     # Jalan otomatis tiap kamu update code

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests pytz pandas

      - name: Running Smart Engine
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
        
